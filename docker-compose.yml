services:
  # Auth service database
  auth-db:
    image: postgres:latest
    restart: always
    env_file:
      - apps/auth-service/.env
    volumes:
      - ./docker-data/auth-db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # Product service database
  product-db:
    image: postgres:latest
    restart: always
    env_file:
      - apps/product-service/.env
    volumes:
      - ./docker-data/product-db:/var/lib/postgresql/data
    ports:
      - 5433:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PRODUCT_DB_USER} -d ${PRODUCT_DB_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # Redis service
  redis:
    image: redis:alpine
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - ./docker-data/redis:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    restart: always
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI
    volumes:
      - ./docker-data/mailhog:/var/lib/mailhog
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:8025/api/v2/messages']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  auth-db-data:
  product-db-data:
  redis-data:
  mailhog-data:
