services:
  vendor-db:
    image: postgres:latest
    container_name: vendor-service-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-vendor_db}
    volumes:
      - ../../docker-data/vendor-db:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vendor_db}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - multivendor-network-2

networks:
  multivendor-network-2:
    external: true
