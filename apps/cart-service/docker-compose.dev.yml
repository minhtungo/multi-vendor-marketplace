services:
  cart-db:
    image: postgres:latest
    container_name: cart-service-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-supersecret}
      - POSTGRES_DB=${POSTGRES_DB:-cart_db}
    volumes:
      - ../../docker-data/cart-db:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-cart_db}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - multivendor-network-2

networks:
  multivendor-network-2:
    external: true
