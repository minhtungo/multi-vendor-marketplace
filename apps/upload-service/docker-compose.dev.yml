services:
  upload-db:
    image: postgres:latest
    container_name: upload-service-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-upload_db}
    volumes:
      - ../../docker-data/upload-db:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-upload_db}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - multivendor-network-2
    # MinIO for file storage
  minio:
    image: minio/minio
    container_name: multivendor-minio
    ports:
      - '${AWS_S3_PORT:-9000}:9000'
      - '9001:9001'
    volumes:
      - ../../docker-data/minio:/data
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - multivendor-network-2

networks:
  multivendor-network-2:
    external: true

volumes:
  minio-data:
