services:
  user-db:
    image: postgres:latest
    container_name: user-service-db
    restart: always
    env_file:
      - .env
    volumes:
      - ../../docker-data/user-db:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-user_db}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - multivendor-network

networks:
  multivendor-network:
    external: true
